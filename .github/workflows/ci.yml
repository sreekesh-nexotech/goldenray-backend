# CI (PLAN §5.5): lint → migrations check → import contracts → tests with the coverage gate → secret scan →
# view budget → deploy config checks → images (pushed for the integration branch / main only, tagged with the SHA).
name: ci

on:
  push:
    branches: [main, "claude/**", "wp/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: flarize.settings.test
  DB_NAME: flarize_ci
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: postgres
  PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements/dev.txt
      - name: Install Chromium and the document fonts (Playwright integration test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-ui-core nginx-light
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" && sudo chown "$USER" "$PLAYWRIGHT_BROWSERS_PATH"
          python -m playwright install --with-deps chromium
      - name: black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: flake8
        run: flake8
      - name: Import contracts
        run: lint-imports
      - name: System checks
        run: python manage.py check --fail-level WARNING
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: View budget (≤ 250 lines per views/ file)
        run: python scripts/check_view_budget.py
      - name: Tests
        run: pytest -q --cov=. --cov-report=term --cov-report=xml
      - name: Coverage gate (85 % on */services/ and engines/)
        run: coverage report --include="*/services/*,*/engines/*" --omit="*/tests/*" --fail-under=85
      - name: Deploy configuration
        run: |
          bash -n deploy/release.sh deploy/scripts/healthz-check.sh
          touch /tmp/empty.env
          IMAGE_TAG=ci ENV_FILE=/tmp/empty.env OWNER_ENV_FILE=/tmp/empty.env DB_ENV_FILE=/tmp/empty.env FRONTEND_ENV_FILE=/tmp/empty.env \
            LEGACY_BACKEND_ENV_FILE=/tmp/empty.env LEGACY_CMS_ENV_FILE=/tmp/empty.env PGBOUNCER_USERLIST=/tmp/empty.env \
            docker compose -f deploy/docker-compose.yml --profile legacy --profile ops config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --config /repo/.gitleaks.toml --redact --verbose

  images:
    needs: [test, secrets]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/bold-goodall-lxgwep')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/platform-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the runtime image (api, worker-default, beat)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push the documents image (worker-documents)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: documents
          push: true
          tags: ${{ env.IMAGE_REPO }}-documents:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
