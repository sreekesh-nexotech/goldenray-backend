[project]
name = "flarize-essl-agent"
version = "2.0.0"
description = "Flarize office agent: reads eSSL/ZK terminals on the office LAN (read-only) and delivers to the platform."
requires-python = ">=3.10"
dependencies = ["pyzk==0.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
essl-agent = "essl_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["essl_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
