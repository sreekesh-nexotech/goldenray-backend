# THE cutover switch (PLAN §6.4, DV-5): where each group of old website URLs is served. http context.
#
#   shim — the new API's legacy adapters: /<old path> → /legacy/<old path> (needs the LEGACY_API_SHIM flag on)
#   old  — the current containers (compose profile "legacy")
#   gone — 404 (after C9, once the legacy containers are removed)
#
# On the VM this file is /srv/flarize/nginx/legacy-switch.conf (LEGACY_SWITCH_FILE). Flip one line, then
#   docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
# Rollback = flip it back and reload. This copy is the C0 state: everything still on the old containers.
map $legacy_group $legacy_mode {
  default          gone;
  cms_content      old;    # C1 → shim
  calculators      old;    # C2 → shim
  leads            old;    # C2 → shim (OTP provider switched at the same time)
  careers          old;    # C2 → shim
  products         old;    # C2 → shim
  reference        old;    # C2 → shim
  installations    old;    # C2 → shim
  forms            old;    # C2 → shim
  seo              old;    # C2 → shim
  bom_public       old;    # C2 → shim
  bom_calculate    old;    # C5 → shim (DV-4)
  cms_other        old;    # never shimmed: Studio admin API, gone after C4
  backend_other    old;    # never shimmed: Studio EMI admin etc., gone after C9
  bom_other        old;    # never shimmed: internal BOM tool, gone after C5/C9
}
