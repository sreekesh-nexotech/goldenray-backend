# Old website URL prefixes (server context, included in the flarize.com server). The versioned API locations
# (/api/v1/, /api/public/v1/, …) are longer prefixes and always win over /api/ here.
location /api/ {
  limit_req zone=public burst=40 nodelay;
  client_max_body_size 20m;  # the old job-application form uploads a resume here
  include /etc/nginx/flarize/snippets/proxy-api.conf;
  if ($legacy_target = "") { return 404; }
  proxy_pass $legacy_target;
}
location /studio-api/ {
  limit_req zone=public burst=40 nodelay;
  client_max_body_size 20m;
  include /etc/nginx/flarize/snippets/proxy-api.conf;
  if ($legacy_target = "") { return 404; }
  proxy_pass $legacy_target;
}
location /bom/ {
  limit_req zone=public burst=40 nodelay;
  include /etc/nginx/flarize/snippets/proxy-api.conf;
  if ($legacy_target = "") { return 404; }
  proxy_pass $legacy_target;
}
