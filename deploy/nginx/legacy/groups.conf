# Old website URLs (PLAN §6.2) → routing group. http context; always included.
#
# Groups marked "shim" in §6.2 have a /legacy/ adapter in the new API (DV-5: nginx sends /<old path> to
# /legacy/<old path>); the *_other groups (Studio admin APIs, /bom/ tools, unlisted endpoints) never get a shim —
# they stay on the old containers until they are retired. core/tests/test_deploy.py checks every §6.2 URL here.
map $uri $legacy_group {
  default "";

  # A versioned-looking path that reached the legacy locations is an unknown API version (/api/v2/…): 404.
  "~^/api/(public/|agent/|customer/)?v[0-9]+/"                                            "";

  # C1 — CMS public delivery (Strapi-shaped), served by the CMS under /studio-api/
  "~^/studio-api/api/(articles|case-studies|authors)(/.*)?$"                              cms_content;
  "~^/studio-api/api/page-content/?$"                                                      cms_content;
  "~^/studio-api/api/(faqs|job-positions)(/.*)?$"                                          cms_content;
  "~^/studio-api/"                                                                         cms_other;

  # C2 — main backend public endpoints under /api/
  "~^/api/(calculate-solar|calculate-solar-new|calculate-solar-advanced)/$"                calculators;
  "~^/api/emi-calculator/((config|quotation)/)?$"                                           calculators;
  "~^/api/(send-otp|verify-otp|lead-collection-home)/$"                                    leads;
  "~^/api/job-applications/"                                                               careers;
  "~^/api/(solar-panels|solar-inverters|batteries)/"                                       products;
  "~^/api/(pincodes|tariffs|device-types|wattages|room-sizes|ev-cars|ev-scooters)/"       reference;
  "~^/api/(customer-installations|installation-stats)/"                                    installations;
  "~^/api/(affiliate-applications|warranty-service-requests)/"                            forms;
  "~^/api/metadata/"                                                                       seo;
  "~^/api/"                                                                                backend_other;

  # BOM app: the two public reads (C2) and the quotation page's calculate call (DV-4); the rest is internal tooling.
  "~^/bom/api/(quotation-testimonials|quotation-settings)/$"                               bom_public;
  "~^/bom/api/calculate/$"                                                                 bom_calculate;
  "~^/bom/"                                                                                bom_other;
}

# The CMS container serves its URLs without the /studio-api prefix (the current nginx strips it).
map $request_uri $legacy_cms_uri {
  "~^/studio-api(?<cms_rest>/.*)$" $cms_rest;
  default $request_uri;
}

# Final destination for "<mode>:<group>" (mode from switch.conf). Empty → 404.
map "$legacy_mode:$legacy_group" $legacy_target {
  default                  "";
  "~^shim:[a-z_]+$"        "http://api/legacy$request_uri";
  "~^old:cms_[a-z_]+$"     "http://legacy-cms:8000$legacy_cms_uri";
  "~^old:[a-z_]+$"         "http://legacy-backend:8000$request_uri";
}
