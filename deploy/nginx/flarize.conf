# Flarize — nginx (PLAN §1.3, §5.4). Mounted as /etc/nginx/conf.d/default.conf (http context); the snippets and the
# legacy routing live in /etc/nginx/flarize/ (this directory). Test: nginx -t   Apply: nginx -s reload
#
#   https://flarize.com   /api/public/v1/ · /api/v1/ · /api/agent/ · /api/customer/ · /api/docs/ · /healthz → api
#                         /media/private/ (internal, X-Accel-Redirect only) · /studio · / → frontend
#                         old website URLs (/api/<old>, /studio-api/, /bom/) → legacy/ (DV-5: shim or old containers)
#   http://:8080          ^~ /iclock/ only (terminals speak plain HTTP), everything else 404

# Docker's embedded DNS: upstream servers are re-resolved, so a recreated api container is picked up without a reload.
resolver 127.0.0.11 valid=10s ipv6=off;

# Old website URLs: which group each belongs to (legacy/groups.conf) and where each group is served right now —
# the cutover switch (legacy/switch.conf, ops-managed on the VM; PLAN §6.4).
include /etc/nginx/flarize/legacy/groups.conf;
include /etc/nginx/flarize/legacy/switch.conf;

log_format flarize_json escape=json
  '{"ts":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr","xff":"$http_x_forwarded_for",'
  '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
  '"legacy_group":"$legacy_group","ua":"$http_user_agent"}';
access_log /var/log/nginx/access.log flarize_json;

# Rate limits per client IP and namespace (PLAN §5.4); Django's scoped throttles are the finer, per-user layer.
limit_req_zone $binary_remote_addr zone=public:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=iclock:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=agent:10m rate=2r/s;
limit_req_status 429;

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;
server_tokens off;

upstream api {
  zone api 64k;
  server api-a:8000 resolve max_fails=2 fail_timeout=10s;
  server api-b:8000 resolve max_fails=2 fail_timeout=10s;
  keepalive 32;
}

upstream frontend {
  zone frontend 64k;
  server frontend:3000 resolve;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name flarize.com www.flarize.com;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://flarize.com$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.flarize.com;
  include /etc/nginx/flarize/snippets/tls.conf;
  return 301 https://flarize.com$request_uri;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name flarize.com;
  include /etc/nginx/flarize/snippets/tls.conf;

  # 2 MB everywhere; 20 MB only where files are uploaded (media library, job applications).
  client_max_body_size 2m;
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 2;

  # ── API surfaces ──────────────────────────────────────────────────────────────────────────────────────────────
  location /api/public/v1/ {
    limit_req zone=public burst=40 nodelay;
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_pass http://api;
  }
  location = /api/public/v1/job-applications/ {
    limit_req zone=public burst=40 nodelay;
    client_max_body_size 20m;
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_pass http://api;
  }
  location /api/v1/ {
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_pass http://api;
  }
  location = /api/v1/media/upload/ {
    client_max_body_size 20m;
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_pass http://api;
  }
  location /api/agent/ {
    limit_req zone=agent burst=10 nodelay;
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_pass http://api;
  }
  location /api/customer/ {
    limit_req zone=public burst=20 nodelay;
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_pass http://api;
  }
  # OpenAPI: staff only, from allow-listed IPs (snippets/docs-allow.conf); prod also requires a staff JWT.
  location /api/docs/ {
    include /etc/nginx/flarize/snippets/docs-allow.conf;
    deny all;
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_pass http://api;
  }
  location /api/schema/ {
    include /etc/nginx/flarize/snippets/docs-allow.conf;
    deny all;
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_pass http://api;
  }
  # Polled by the VM cron and deploy/release.sh; not public (it names the failing dependency).
  location = /healthz {
    allow 127.0.0.1;
    allow ::1;
    allow 172.28.0.0/16;
    deny all;
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_pass http://api;
  }

  # ── Private files: only reachable through X-Accel-Redirect after Django checked a signed URL ─────────────────
  location ^~ /media/private/ {
    internal;
    alias /srv/flarize/media/private/;
    include /etc/nginx/flarize/snippets/hsts.conf;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
  }

  # ── Old website contracts (PLAN §6.2, DV-5) ───────────────────────────────────────────────────────────────────
  include /etc/nginx/flarize/legacy/routes.conf;

  # ── Website + Studio (Next.js) ───────────────────────────────────────────────────────────────────────────────
  location /_next/static/ {
    include /etc/nginx/flarize/snippets/proxy-frontend.conf;
    proxy_pass http://frontend;
    include /etc/nginx/flarize/snippets/hsts.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /studio {
    include /etc/nginx/flarize/snippets/proxy-frontend.conf;
    proxy_pass http://frontend;
  }
  location / {
    include /etc/nginx/flarize/snippets/proxy-frontend.conf;
    proxy_pass http://frontend;
  }
}

# Attendance terminals (eSSL ADMS) speak plain HTTP: this listener serves /iclock/ and nothing else (PLAN §5.4).
server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  client_max_body_size 1m;

  location ^~ /iclock/ {
    limit_req zone=iclock burst=20 nodelay;
    include /etc/nginx/flarize/snippets/proxy-api.conf;
    proxy_set_header X-Forwarded-Proto http;
    proxy_pass http://api;
  }
  location / {
    return 404;
  }
}
