# Errors nginx produces itself on the API surfaces answer in the JSON envelope {code, message, errors, error_codes}
# (PLAN §3.1): body too large, rate limited, docs allow-list denial, upstream down or slow. Included in every API
# location; the named locations live in api-error-pages.conf (server level). Django's own error responses pass
# through untouched because proxy_intercept_errors stays off.
error_page 403 = @api_403;
error_page 413 = @api_413;
error_page 429 = @api_429;
error_page 502 = @api_502;
error_page 503 = @api_503;
error_page 504 = @api_504;
