ssl_certificate /etc/letsencrypt/live/flarize.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/flarize.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
include /etc/nginx/flarize/snippets/hsts.conf;
