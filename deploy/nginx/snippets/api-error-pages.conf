# JSON bodies for the errors nginx itself returns on the API surfaces (see api-errors.conf). Server-level include.
# X-Request-ID matches the request_id of the nginx access log line, so a client report can be traced.
location @api_403 {
  default_type application/json;
  include /etc/nginx/flarize/snippets/hsts.conf;
  add_header X-Request-ID $request_id always;
  return 403 '{"code":"permission_denied","message":"You do not have permission to perform this action.","errors":{},"error_codes":["permission_denied"]}';
}
location @api_413 {
  default_type application/json;
  include /etc/nginx/flarize/snippets/hsts.conf;
  add_header X-Request-ID $request_id always;
  return 413 '{"code":"request_too_large","message":"The request body is too large.","errors":{},"error_codes":["request_too_large"]}';
}
location @api_429 {
  default_type application/json;
  include /etc/nginx/flarize/snippets/hsts.conf;
  add_header X-Request-ID $request_id always;
  add_header Retry-After 1 always;
  return 429 '{"code":"throttled","message":"Request was throttled.","errors":{},"error_codes":["throttled"]}';
}
location @api_502 {
  default_type application/json;
  include /etc/nginx/flarize/snippets/hsts.conf;
  add_header X-Request-ID $request_id always;
  return 502 '{"code":"bad_gateway","message":"The service is temporarily unavailable. Please retry shortly.","errors":{},"error_codes":["bad_gateway"]}';
}
location @api_503 {
  default_type application/json;
  include /etc/nginx/flarize/snippets/hsts.conf;
  add_header X-Request-ID $request_id always;
  return 503 '{"code":"service_unavailable","message":"The service is temporarily unavailable. Please retry shortly.","errors":{},"error_codes":["service_unavailable"]}';
}
location @api_504 {
  default_type application/json;
  include /etc/nginx/flarize/snippets/hsts.conf;
  add_header X-Request-ID $request_id always;
  return 504 '{"code":"gateway_timeout","message":"The service took too long to respond. Please retry.","errors":{},"error_codes":["gateway_timeout"]}';
}
