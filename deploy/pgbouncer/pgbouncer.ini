; PgBouncer in front of PostgreSQL 16 (PLAN §1.4, §5.2): transaction pooling, so Django runs with CONN_MAX_AGE=0 and
; DISABLE_SERVER_SIDE_CURSORS=True (flarize/settings/base.py). Credentials live in /srv/flarize/pgbouncer/userlist.txt
; on the VM (SCRAM verifiers, root-only 0600; docs/ops/secrets.md) — never in git.
[databases]
flarize = host=db port=5432 dbname=flarize

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 40
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 30
; psycopg sends these at connect; they are session-level and meaningless under transaction pooling.
ignore_startup_parameters = extra_float_digits,options
max_prepared_statements = 0
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
log_connections = 0
log_disconnections = 0
